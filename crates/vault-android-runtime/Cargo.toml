[package]
name = "vaultmesh-android-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "vaultmesh_android_runtime"
crate-type = ["cdylib", "rlib"]

[dependencies]
vaultmesh-sync = { path = "../vault-sync" }
atomic-write-file.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
rand_core.workspace = true
sha2.workspace = true
scrypt = "0.11.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
vaultmesh-core = { path = "../vault-core" }
vaultmesh-lan-pairing = { path = "../vault-lan-pairing", features = ["sync"] }
zeroize.workspace = true
uuid.workspace = true
url = "2.5.8"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[dev-dependencies]
vaultmesh-ffi = { path = "../vault-ffi" }
vaultmesh-sync = { path = "../vault-sync", features = ["test-hooks"] }
