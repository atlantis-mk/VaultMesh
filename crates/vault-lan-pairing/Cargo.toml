[package]
name = "vaultmesh-lan-pairing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
sync = []
desktop-sync = ["sync", "dep:vaultmesh-ffi"]

[dependencies]
vaultmesh-core = { path = "../vault-core" }
vaultmesh-sync = { path = "../vault-sync" }
atomic-write-file.workspace = true
base64.workspace = true
hmac.workspace = true
if-addrs = "0.15.0"
mdns-sd = { version = "0.21.3", default-features = false }
rand_core.workspace = true
rcgen = "0.14.8"
rustls = { version = "0.23.35", default-features = false, features = ["aws_lc_rs", "std"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2 = "0.6.5"
spake2-conflux.workspace = true
uuid.workspace = true
vaultmesh-ffi = { path = "../vault-ffi", optional = true }
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
vaultmesh-core = { path = "../vault-core" }
