related_changes:
  - "CHG-2026-084-passkey-page-shim"
boundaries:
  - "浏览器信任与授权：浏览器解锁由单次临时解锁改为会话持久解锁（取代 ADR-0055 的该部分），支付卡与 masterPasswordReprompt 仍强制主密码重验，Passkey 仍保留每次桌面系统确认"
  - "公共 Browser RPC：新增 browser.unlock.request，并新增桌面 operation browser.pin.status/enable/disable 与 agent.pin.status；既有 vault.unlock、pin.*、biometric.authentication.* 保持兼容"
  - "多窗口特权边界：嵌入式 LAAuthenticationView 与窗口布局命令只授予 main 与 agent-unlock，agent-pairing 与 agent-authorization 保持禁用"
  - "三端授权与 PIN 隔离：state.pin、state.browser_pin、state.agent_pin 保持独立存储与失败计数，仅提供桌面统一管理入口；Windows Hello 仍不支持（OPEN-001 不关闭）"
  - "平台范围：不修改 Android 解锁流程，不扩大 Firefox Passkey 范围，无 Vault 格式或持久化 schema 变化"
risks:
  - "会话持久解锁扩大了浏览器解锁后的有效窗口，依赖 PluginSecurityPolicy（空闲、系统锁定、浏览器重启）、vault.lock 与撤销保证自动锁定"
  - "多窗口嵌入式认证的焦点切换与 generation 抢占只能在真实签名 macOS 包上完整验证"
  - "浏览器与桌面共享 browser_pin 服务实例，需防止桌面主密码解锁误重置浏览器 PIN 失败计数"
next:
  - "Slice 1–3 实现已完成；在真实签名 macOS + Chromium 完成 AT-DESKTOP-AUTH-001、AT-BROWSER-001 与 AT-AGENT-UNLOCK-001 增量验收"
  - "验收通过后运行 pnpm work:finish -- CHG-2026-085-unified-compact-unlock-and-browser-session 收尾"
