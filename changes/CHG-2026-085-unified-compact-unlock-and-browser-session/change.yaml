schema: "2"
id: "CHG-2026-085-unified-compact-unlock-and-browser-session"
title: "统一紧凑解锁窗口与浏览器会话持久解锁"
type: "feature"
status: "Active"
spec_revision: "0.1.53-active"
target_release: null
goal: "统一三端紧凑解锁窗口并将浏览器单次临时解锁改为会话持久解锁；改变浏览器信任与解锁边界、Browser RPC 与 PIN 管理契约，须经 ADR-0058 并跨平台真机验收。"
