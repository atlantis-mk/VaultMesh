related_changes: []
boundaries:
  - "Android 使用 Compose/Kotlin 独立产品 shell，不依赖 Tauri desktop runtime；vault-core 继续唯一拥有加密、format、模型与秘密 session"
  - "JNI 只暴露固定 Vault lifecycle 与各类型基础 Item operation，不暴露 raw pointer、Vault Key、完整 payload 或通用 method router"
  - "当前切片仅使用 app-private storage 并支持 Login、Card、SSH、Identity、Secret 基础 CRUD、摘要搜索与适用回收站；受保护值查看/复制、Autofill、Credential Manager、Passkey、quick unlock、外部文件、网络与后台服务不在当前授权范围"
  - "Debug application ID 使用 .debug 后缀，真机验证不得清除或覆盖产品 application ID 的数据"
risks:
  - "主密码和 Item 新秘密值经过 JVM String 时不能保证原位擦除，必须缩短存活期并在调用结束后清空 Compose state"
  - "Android lifecycle 与进程终止不会可靠发送单一退出事件，必须以进程内授权不可恢复和多信号 lock 保持 fail closed"
  - "arm64 真机已覆盖首切片 JNI 与 lifecycle，但 release 签名、依赖审查和更广设备矩阵尚未完成"
next:
  - "arm64 真机的 Android Debug instrumentation 已覆盖此前固定 JNI 与 lifecycle，仍需完成 AT-ANDROID-001 至 AT-ANDROID-021 中适用的手动 UI、LAN 互通、文档提供者和 release JNI 验收"
  - "完成 release 签名、依赖审查和发布设备矩阵后，再评估发布"
