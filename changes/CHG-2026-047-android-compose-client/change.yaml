related_changes: []
boundaries:
  - "Android 使用 Compose/Kotlin 独立产品 shell，不依赖 Tauri desktop runtime；vault-core 继续唯一拥有加密、format、模型与秘密 session"
  - "JNI 只暴露固定 Vault lifecycle 与基础 Login CRUD operation，不暴露 raw pointer、Vault Key、完整 payload 或通用 method router"
  - "当前切片仅使用 app-private storage 并支持基础 Login CRUD、摘要搜索与 Login 回收站；Autofill、Credential Manager、Passkey、quick unlock、外部文件、网络与后台服务不在当前授权范围"
  - "Debug application ID 使用 .debug 后缀，真机验证不得清除或覆盖产品 application ID 的数据"
risks:
  - "主密码和 Login 新密码经过 JVM String 时不能保证原位擦除，必须缩短存活期并在调用结束后清空 Compose state"
  - "Android lifecycle 与进程终止不会可靠发送单一退出事件，必须以进程内授权不可恢复和多信号 lock 保持 fail closed"
  - "arm64 真机已覆盖首切片 JNI 与 lifecycle，但 release 签名、依赖审查和更广设备矩阵尚未完成"
next:
  - "Vault lifecycle、基础 Login CRUD、摘要搜索与 Login 回收站已实现；host 回滚测试、固定 JNI/脱敏 DTO contract、Debug/Release 构建和 Xiaomi 2206122SC API 36 真机 instrumentation 均已通过"
  - "完成基础 Login CRUD、搜索和回收站的真机手动 UI 验收后，再推进其他 Item 类型"
  - "完成 release 签名、依赖审查和发布设备矩阵后，再评估发布"
  - "本机 API 36.1 AVD 仍显示 adb offline；已有 arm64 真机证据，因此该模拟器问题不阻塞首切片继续开发"
