boundaries:
  - "用户明确要求一起完成 card/identity 原生填充、同类型捕获确认更新和生成器插入/桌面受控复制；允许同步扩展无值来源计划和有界生成结果契约，仍不返回整条明文 CipherView"
  - "用户将 Vault 备份/恢复、批量文件导入和 SSH 扫描导入留在桌面，不再迁移为副本入口，也不为此扩展插件 RPC/文件对话框生命周期；既有桌面/原插件兼容契约及恢复码编辑辅助不因本次范围澄清删除"
  - "Bitwarden 副本仍是 transient remote UI，不打开 Vault、不保存 Vault response、不持有 Vault Key"
  - "会话和 Login 编辑接现有 Browser RPC；execute 接无值 nativeLoginPlan，profile 仅提供无秘密规划元数据；不改变 RPC v2 或 Native ABI"
  - "用户明确选择独立开发身份并存：专用 Native Host、配对凭据及 Broker 授权；不得覆盖现有 WXT 身份、注册或共享其授权；开发入口不进入发布"
  - "Login detail 以 fresh gesture 特权编辑读取；删除沿用 command-bound one-use confirmation；原生识别与执行器必须保留，TOTP seed/custom 值归 desktop，frame 必须独立绑定与校验"
  - "恢复码 import-file 增加兼容性 prepare/finish phase：独立编辑窗口最多 45 秒隐藏例外，代码原样保存成功后才准许桌面一次性句柄清理；既有无 phase 路径与 Native ABI 不变"
risks:
  - "2026-09-12 npm audit --omit=dev 报告现行 Angular 21.2.17 依赖链 7 个受影响包（3 high、4 moderate）；不能据构建成功视为发布安全通过，需单独核对可达性并升级修复。当前 Node 24.12.0 也低于上游声明 >=24.17.0"
  - "QR 使用已随上游依赖安装的 jsqr 1.4.0（Apache-2.0），显式固定为运行依赖；不加载远程 decoder 或页面脚本"
  - "上游未适配服务源码保留用于追踪，但不能重新接入运行入口或绕过 VaultMesh privilege boundary"
  - "将 protected detail 错接到普通 list 会扩大浏览器披露面"
  - "编辑会话通过现有 events.poll 和 background 实例变更失效；现有 Login mutation 没有新增跨客户端原子版本比较契约"
next:
  - "会话页及 Login CRUD、桌面剪贴板、trash/history 和逐次主密码恢复码查看/复制已接现有 Broker；目标浏览器与桌面端联调仍待执行"
  - "原生 Login 多 frame、显式跨源确认、TOTP/custom、页内目标、自动填充、捕获保存与修改密码生成已接入；继续执行整体验证并修正边界"
  - "独立开发身份、专用 Native Host 注册计划及 debug Broker 已实现；未执行安装、真实浏览器或目标 OS 联调"
  - "独立编辑窗口、45 秒有界原生对话框、恢复码两阶段文件导入和保存后清理已实现；仍待目标浏览器/OS 的原生文件框及窗口焦点验收"
  - "已接 card/identity/SSH/Secret 管理、类型限定桌面复制、card/identity/SSH trash/history、安全设置/PIN/生物识别、四模式生成器、QR、邮箱 OTP 与 bounded watch、Chromium Passkey 及归属删除、创建 Vault/主密码轮换；继续运行总体回归与双浏览器构建，不能代替真机验收"
  - "剩余 card/identity/SSH/Secret 原生填充及非 Login 捕获、生成器插入/受控复制；桌面集中的备份/恢复和批量/扫描导入已从迁移缺口剔除；不得接回旧 WXT DOM 匹配或上游云服务以宣称完成"
  - "下一受控边界：现行 nativeLoginPlan 只批准 Login 来源；非 Login（含 select/格式化）仍需扩展主规格与 ADR-0003。无需为已排除的备份/恢复/导入设计新的原生文件操作两阶段契约或隐藏草稿例外"
