related_changes:
  - "CHG-2026-083-passkey-intercept-fallback"
boundaries:
  - "浏览器信任模型：移除 webAuthenticationProxy 权限，新增 MAIN world content script、隔离世界 PermissionsPolicy 门禁与可信帧树校验"
  - "Browser RPC 新增受既有配对鉴权的 passkeys.cancel；origin、sameOriginWithAncestors 与 topOrigin 只能由 background 依据 sender 与 resolveFrameAncestry 帧树写入"
  - "协议校验、clientDataJSON（含 topOrigin）与 ES256 签名归属 crates/vault-core 与 crates/vault-ffi；扩展本地策略与站点模式保留在 browser-extension"
  - "Firefox 范围不变，FirefoxPasskeyAdapter 保持 disabled 且不注入 Passkey shim"
risks:
  - "页面可检测或绕过 shim，只影响该页面是否使用 VaultMesh，不得降低秘密保护"
  - "响应对象必须在 PublicKeyCredential 原型下可被主流网站库接受，需要真实站点验收"
  - "CHG-2026-083 已 Active 且部分行为被取代，完成后需要一并收尾"
next:
