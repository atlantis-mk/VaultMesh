boundaries:
  - "仅固定字段操作在 core 内核验当次主密码并取值，JNI 返回有界值供 Kotlin 特权服务写系统剪贴板；摘要、Compose 列表和持久状态不持有受保护值"
  - "Android 剪贴板标记 sensitive，30 秒到期仅清理仍由本应用拥有的 clip，不清除用户后续复制的内容"
  - "Passkey 不经普通 Secret 复制，所有受保护操作在锁定或 lifecycle generation 失效后拒绝"
risks:
  - "Android 后台剪贴板读取受平台限制，定时清理依赖变更监听与标签所有权；需真机验证替换、后台和版本差异"
  - "JVM 字符串中的短期复制值不能原位可靠擦除，Kotlin 服务必须最小化引用和期限"
next:
  - "固定 JNI 字段访问、Kotlin 特权剪贴板服务、Compose 确认 UI 和 Host/contract 测试已通过本地检查"
