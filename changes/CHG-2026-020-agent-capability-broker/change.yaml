affected_formats:
  - "Vault envelope format 3 is the only create/write/read format; every other version is rejected before KDF with no migration or downgrade path"
  - "Agent local authorization store v2 (typed SSH and HTTP path predicates; OS-protected key + AEAD owner-only file)"
  - "Agent Broker IPC v2"
  - "HTTP MCP tool contract v2; unreleased credential-lifecycle tools removed"
  - "Agent access settings v1 (owner-only non-secret JSON)"
  - "OpenSSH user config managed include/host fragment v1"
  - "Vault format 3 optional encrypted managed SSH host binding (pre-release additive field; unsupported old writers fail closed)"
affected_versions:
  - "macOS and Windows Tauri desktop"
  - "local stdio MCP clients, including Codex CLI and OpenCode"
security_impact: "Adds a new local untrusted Agent boundary and delegated remote-operation authority. The Rust broker remains the sole authorization and secret-use owner; MCP never exposes credential values, and every broker operation is account-, target-, capability-, request-, expiry- and session-bound. An explicitly confirmed R3 OpenSSH host setup can additionally create durable OS-user SSH authority outside per-command MCP authorization, using broker-owned key generation, target binding and local config writes."
migration: "AgentProfile, Profile permission rules and Profile CRUD remain removed before release. Vault format 3 is the only create/write/read format; every other version is rejected before KDF across Core, FFI, Tauri, Agent, Browser, quick unlock and restore, with no legacy reader, migration, downgrade or dedicated backup API. The optional pre-release managed SSH host binding defaults absent for ordinary SSH items; unsupported old writers are not a compatibility surface and binding loss fails closed. A legacy local manifest is removed only after its local key matches the encrypted Vault key record. The unreleased credential lifecycle tools, ActionPlans and writers are removed without permission migration; legacy revoked/needs-review markers remain read-only and fail closed. Missing or invalid Agent access settings keep the 15-minute idle and 8-hour absolute defaults."
