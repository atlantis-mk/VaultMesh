name: Publish R2 review release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Review SemVer without a leading v (must start at 0.0.1-review)"
        required: true
        default: "0.0.10-review"
        type: string
      notes:
        description: "Short reviewer-facing release notes"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vaultmesh-r2-review-releases
  cancel-in-progress: false

jobs:
  extension:
    name: Build Chrome and Firefox extensions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VAULTMESH_EXTENSION_DISTRIBUTION: sideload-review
      VAULTMESH_FIREFOX_EXTENSION_ID: vaultmesh@atlantis-mk.github.io
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and validate Chrome and Firefox Review ZIPs
        run: >-
          node scripts/build-browser-extension-release.mjs
          --output "$RUNNER_TEMP/vaultmesh-browser-extensions"
      - uses: actions/upload-artifact@v7
        with:
          name: vaultmesh-browser-extensions
          path: ${{ runner.temp }}/vaultmesh-browser-extensions
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.platform_key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            platform_key: darwin-aarch64
            host_platform: darwin
            host_arch: arm64
            bundles: app,dmg
            apple_signing_identity: "-"
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform_key: darwin-x86_64
            host_platform: darwin
            host_arch: x64
            bundles: app,dmg
            apple_signing_identity: "-"
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform_key: windows-x86_64
            host_platform: win32
            host_arch: x64
            bundles: nsis,msi
            apple_signing_identity: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VAULTMESH_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      VAULTMESH_UPDATER_ENDPOINT: ${{ vars.R2_PUBLIC_BASE_URL }}/channels/review/latest.json
      VAULTMESH_EXTENSION_DISTRIBUTION: sideload-review
      VAULTMESH_FIREFOX_EXTENSION_ID: vaultmesh@atlantis-mk.github.io
      VAULTMESH_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VAULTMESH_GOOGLE_OAUTH_CLIENT_ID }}
      VAULTMESH_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.VAULTMESH_GOOGLE_OAUTH_CLIENT_SECRET }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Validate required desktop OAuth build configuration
        run: node scripts/validate-desktop-oauth-build-config.mjs
      - name: Validate Review version matches source metadata
        env:
          REVIEW_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const sourceVersion = JSON.parse(readFileSync("package.json", "utf8")).version;
            if (!/^\d+\.\d+\.\d+-review(?:\.\d+)?$/.test(process.env.REVIEW_VERSION ?? "")) {
              throw new Error("Review version must use the <major>.<minor>.<patch>-review[.<n>] form.");
            }
            if (process.env.REVIEW_VERSION !== sourceVersion) {
              throw new Error(`Review version ${process.env.REVIEW_VERSION} does not match source ${sourceVersion}.`);
            }
          '
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Compute Rust dependency cache key
        id: cargo-cache-key
        run: node scripts/rust-dependency-cache-key.mjs --github-output
      - name: Restore Cargo downloads and dependency objects
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/.fingerprint
          key: vaultmesh-cargo-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.cargo-cache-key.outputs.hash }}
          restore-keys: |
            vaultmesh-cargo-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
      - name: Verify GitHub-hosted runner matches target architecture
        env:
          EXPECTED_HOST_PLATFORM: ${{ matrix.host_platform }}
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
        run: |
          node --input-type=module -e '
            const { EXPECTED_HOST_PLATFORM: platform, EXPECTED_HOST_ARCH: arch } = process.env;
            if (process.platform !== platform || process.arch !== arch) {
              throw new Error(`Expected hosted runner ${platform}/${arch}, received ${process.platform}/${process.arch}.`);
            }
          '
      - name: Select complete Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perlDirectory = "C:\Strawberry\perl\bin"
          $perlExecutable = Join-Path $perlDirectory "perl.exe"
          if (-not (Test-Path $perlExecutable)) {
            throw "The Windows runner does not provide Strawberry Perl."
          }
          & $perlExecutable -MLocale::Maketext::Simple -e "print qq(Perl modules ready\n)"
          "OPENSSL_SRC_PERL=$perlExecutable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install toolchains and dependencies
        run: |
          rustup target add "${{ matrix.target }}"
          pnpm install --frozen-lockfile
      - name: Build signed updater artifact and unsigned review installer
        run: >-
          node scripts/build-tauri.mjs
          --release-identity
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
          --updater-version "${{ inputs.version }}"
      - name: Normalize platform artifacts
        run: >-
          node scripts/collect-tauri-update-artifact.mjs
          --workspace "$GITHUB_WORKSPACE"
          --platform "${{ matrix.platform_key }}"
          --version "${{ inputs.version }}"
          --output "$RUNNER_TEMP/vaultmesh-update"
      - uses: actions/upload-artifact@v7
        with:
          name: vaultmesh-update-${{ matrix.platform_key }}
          path: ${{ runner.temp }}/vaultmesh-update
          if-no-files-found: error
          retention-days: 7
      - name: Remove workspace release objects before saving dependency cache
        run: >-
          cargo clean --release --target "${{ matrix.target }}"
          -p vaultmesh-agent-mcp
          -p vaultmesh-core
          -p vaultmesh-ffi
          -p vaultmesh-tauri-desktop

  publish:
    name: Publish immutable artifacts then review channel
    needs: [build, extension]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      RELEASE_NOTES: ${{ inputs.notes }}
      RELEASE_VERSION: ${{ inputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Require successful platform and extension builds
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          EXTENSION_RESULT: ${{ needs.extension.result }}
        run: |
          if [[ "$BUILD_RESULT" != "success" || "$EXTENSION_RESULT" != "success" ]]; then
            echo "One or more platform or extension builds failed. Use Re-run failed jobs on this workflow run so successful artifacts are reused." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: vaultmesh-update-*
          path: ${{ runner.temp }}/vaultmesh-update
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: vaultmesh-browser-extensions
          path: ${{ runner.temp }}/vaultmesh-browser-extensions
      - name: Validate channel and build publication
        run: |
          set -euo pipefail
          current_manifest="$RUNNER_TEMP/current-latest.json"
          current_status="$(curl --silent --show-error --output "$current_manifest" --write-out '%{http_code}' "${R2_PUBLIC_BASE_URL%/}/channels/review/latest.json")"
          if [[ "$current_status" == "404" ]]; then
            rm -f "$current_manifest"
          elif [[ "$current_status" != "200" ]]; then
            echo "Unable to read current review channel (HTTP $current_status)." >&2
            exit 1
          fi
          arguments=(
            --input "$RUNNER_TEMP/vaultmesh-update"
            --output "$RUNNER_TEMP/vaultmesh-publication"
            --version "$RELEASE_VERSION"
            --base-url "$R2_PUBLIC_BASE_URL"
            --notes "$RELEASE_NOTES"
          )
          if [[ -s "$current_manifest" ]]; then
            arguments+=(--current "$current_manifest")
          fi
          node scripts/create-update-manifest.mjs "${arguments[@]}"
          for browser in chrome firefox; do
            asset="VaultMesh_${RELEASE_VERSION}_${browser}-extension.zip"
            source="$RUNNER_TEMP/vaultmesh-browser-extensions/$asset"
            [[ -f "$source" ]] || {
              echo "Missing R2 extension asset: $asset" >&2
              exit 1
            }
            sha256="$(sha256sum "$source" | awk '{print $1}')"
            printf '%s\t%s\t%s\t%s\n' \
              "$source" \
              "releases/v${RELEASE_VERSION}/${asset}" \
              "application/zip" \
              "$sha256" \
              >> "$RUNNER_TEMP/vaultmesh-publication/immutable.tsv"
          done
      - name: Publish immutable version objects
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          while IFS=$'\t' read -r source key content_type sha256; do
            [[ -n "$source" && -n "$key" && -n "$content_type" && -n "$sha256" ]]
            existing_sha256="$(aws s3api head-object --endpoint-url "$endpoint" --bucket "$R2_BUCKET" --key "$key" --query 'Metadata.sha256' --output text 2>/dev/null || true)"
            if [[ "$existing_sha256" == "None" ]]; then
              echo "Refusing to overwrite immutable R2 object without matching digest metadata: $key" >&2
              exit 1
            elif [[ -n "$existing_sha256" ]]; then
              if [[ "$existing_sha256" != "$sha256" ]]; then
                echo "Refusing to overwrite immutable R2 object with different content: $key" >&2
                exit 1
              fi
              echo "Immutable object already matches; skipping: $key"
              continue
            fi
            aws s3 cp "$source" "s3://${R2_BUCKET}/${key}" \
              --endpoint-url "$endpoint" \
              --content-type "$content_type" \
              --cache-control "public, max-age=31536000, immutable" \
              --metadata "sha256=$sha256" \
              --no-progress
          done < "$RUNNER_TEMP/vaultmesh-publication/immutable.tsv"
      - name: Publish latest.json last and verify
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          source="$RUNNER_TEMP/vaultmesh-publication/latest.json"
          aws s3 cp "$source" "s3://${R2_BUCKET}/channels/review/latest.json" \
            --endpoint-url "$endpoint" \
            --content-type "application/json" \
            --cache-control "no-store, max-age=0" \
            --no-progress
          downloaded="$RUNNER_TEMP/published-latest.json"
          aws s3 cp "s3://${R2_BUCKET}/channels/review/latest.json" "$downloaded" \
            --endpoint-url "$endpoint" \
            --no-progress
          cmp "$source" "$downloaded"
          for browser in chrome firefox; do
            asset="VaultMesh_${RELEASE_VERSION}_${browser}-extension.zip"
            published="$RUNNER_TEMP/published-$asset"
            curl --fail --silent --show-error \
              "${R2_PUBLIC_BASE_URL%/}/releases/v${RELEASE_VERSION}/${asset}" \
              --output "$published"
            cmp "$RUNNER_TEMP/vaultmesh-browser-extensions/$asset" "$published"
          done
      - name: Write reviewer download links
        run: |
          base="${R2_PUBLIC_BASE_URL%/}/releases/v${RELEASE_VERSION}"
          {
            echo "## VaultMesh ${RELEASE_VERSION} review release"
            echo
            echo "- [macOS Apple Silicon DMG](${base}/VaultMesh_${RELEASE_VERSION}_darwin-aarch64.dmg)"
            echo "- [macOS Intel DMG](${base}/VaultMesh_${RELEASE_VERSION}_darwin-x86_64.dmg)"
            echo "- [Windows x64 installer](${base}/VaultMesh_${RELEASE_VERSION}_windows-x86_64-setup.exe)"
            echo "- [Windows x64 MSI installer](${base}/VaultMesh_${RELEASE_VERSION}_windows-x86_64-installer.msi)"
            echo "- [Chrome/Chromium extension ZIP](${base}/VaultMesh_${RELEASE_VERSION}_chrome-extension.zip)"
            echo "- [Firefox extension ZIP](${base}/VaultMesh_${RELEASE_VERSION}_firefox-extension.zip)"
            echo "- [Updater manifest](${R2_PUBLIC_BASE_URL%/}/channels/review/latest.json)"
          } >> "$GITHUB_STEP_SUMMARY"

  github_prerelease:
    name: Create GitHub draft prerelease
    needs: [build, publish, extension]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_NOTES: ${{ inputs.notes }}
      RELEASE_VERSION: ${{ inputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Require successful build, publish, and extension jobs
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          EXTENSION_RESULT: ${{ needs.extension.result }}
        run: |
          if [[ "$BUILD_RESULT" != "success" || "$PUBLISH_RESULT" != "success" || "$EXTENSION_RESULT" != "success" ]]; then
            echo "Review prerequisites are incomplete. Use Re-run failed jobs on this workflow run so successful artifacts are reused." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: vaultmesh-update-*
          path: ${{ runner.temp }}/vaultmesh-update
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: vaultmesh-browser-extensions
          path: ${{ runner.temp }}/vaultmesh-update
      - name: Create or resume GitHub draft prerelease
        env:
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          asset_directory="$RUNNER_TEMP/vaultmesh-update"
          assets=(
            "VaultMesh_${RELEASE_VERSION}_darwin-aarch64.dmg"
            "VaultMesh_${RELEASE_VERSION}_darwin-x86_64.dmg"
            "VaultMesh_${RELEASE_VERSION}_windows-x86_64-setup.exe"
            "VaultMesh_${RELEASE_VERSION}_windows-x86_64-installer.msi"
            "VaultMesh_${RELEASE_VERSION}_chrome-extension.zip"
            "VaultMesh_${RELEASE_VERSION}_firefox-extension.zip"
          )
          for asset in "${assets[@]}"; do
            [[ -f "$asset_directory/$asset" ]] || {
              echo "Missing GitHub prerelease asset: $asset" >&2
              exit 1
            }
          done
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Refusing to create a Review draft for an existing Git tag: $tag" >&2
            exit 1
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            notes_file="$RUNNER_TEMP/github-prerelease-notes.md"
            {
              echo "$RELEASE_NOTES"
              echo
              echo "Review build for manual platform acceptance. This draft is not a Stable release and does not create a Git tag."
            } > "$notes_file"
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title "VaultMesh ${RELEASE_VERSION}" \
              --notes-file "$notes_file" \
              --draft \
              --prerelease
          fi
          release_state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,targetCommitish)"
          [[ "$(jq -r '.isDraft' <<<"$release_state")" == "true" ]]
          [[ "$(jq -r '.isPrerelease' <<<"$release_state")" == "true" ]]
          [[ "$(jq -r '.targetCommitish' <<<"$release_state")" == "$RELEASE_TARGET" ]]
          mapfile -t published_assets < <(
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          )
          for asset in "${assets[@]}"; do
            if printf '%s\n' "${published_assets[@]}" | grep -Fxq "$asset"; then
              echo "Draft asset already exists; skipping: $asset"
              continue
            fi
            gh release upload "$tag" "$asset_directory/$asset" --repo "$GITHUB_REPOSITORY"
          done
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Draft prerelease unexpectedly created a Git tag: $tag" >&2
            exit 1
          fi
          release_url="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          echo "GitHub Draft Prerelease: $release_url" >> "$GITHUB_STEP_SUMMARY"
