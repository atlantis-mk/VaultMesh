<section aria-label="凭据生成器">
  <h2>凭据生成器</h2>
  <form (ngSubmit)="generate()" autocomplete="off">
    <fieldset [disabled]="loading() || busy()">
    <label>生成类型 <select name="generatorMode" [(ngModel)]="preferences.mode" (ngModelChange)="clear()"><option value="password">密码</option><option value="passphrase">口令短语</option><option value="username">用户名</option><option value="uuid">UUID</option></select></label>
    @switch (preferences.mode) {
      @case ('password') {
        <bit-form-field><bit-label>长度（8–128）</bit-label><input bitInput type="number" name="passwordLength" [(ngModel)]="preferences.password.length" min="8" max="128" /></bit-form-field>
        <label class="tw-block"><input type="checkbox" name="uppercase" [(ngModel)]="preferences.password.uppercase" /> 大写</label>
        <label class="tw-block"><input type="checkbox" name="lowercase" [(ngModel)]="preferences.password.lowercase" /> 小写</label>
        <label class="tw-block"><input type="checkbox" name="numbers" [(ngModel)]="preferences.password.numbers" /> 数字</label>
        <label class="tw-block"><input type="checkbox" name="symbols" [(ngModel)]="preferences.password.symbols" /> 符号</label>
        <label class="tw-block"><input type="checkbox" name="avoidAmbiguous" [(ngModel)]="preferences.password.avoidAmbiguous" /> 排除易混淆字符</label>
        <bit-form-field><bit-label>最少数字（0–8）</bit-label><input bitInput type="number" name="minimumNumbers" [(ngModel)]="preferences.password.minimumNumbers" min="0" max="8" /></bit-form-field>
        <bit-form-field><bit-label>最少符号（0–8）</bit-label><input bitInput type="number" name="minimumSymbols" [(ngModel)]="preferences.password.minimumSymbols" min="0" max="8" /></bit-form-field>
      }
      @case ('passphrase') {
        <bit-form-field><bit-label>词数（3–8）</bit-label><input bitInput type="number" name="wordCount" [(ngModel)]="preferences.passphrase.wordCount" min="3" max="8" /></bit-form-field>
        <label>分隔符 <select name="separator" [(ngModel)]="preferences.passphrase.separator">@for (separator of ['-', '.', '_', ' ']; track separator) { <option [value]="separator">{{ separator === ' ' ? '空格' : separator }}</option> }</select></label>
        <label class="tw-block"><input type="checkbox" name="capitalizeWords" [(ngModel)]="preferences.passphrase.capitalize" /> 首字母大写</label>
        <label class="tw-block"><input type="checkbox" name="phraseNumber" [(ngModel)]="preferences.passphrase.includeNumber" /> 包含数字</label>
      }
      @case ('username') {
        <bit-form-field><bit-label>长度（8–24）</bit-label><input bitInput type="number" name="usernameLength" [(ngModel)]="preferences.username.length" min="8" max="24" /></bit-form-field>
        <bit-form-field><bit-label>前缀（最多 8 位字母、数字、下划线或短横线）</bit-label><input bitInput name="usernamePrefix" [(ngModel)]="preferences.username.prefix" maxlength="8" /></bit-form-field>
        <label>风格 <select name="usernameStyle" [(ngModel)]="preferences.username.style"><option value="readable">可读单词</option><option value="random">随机字符</option></select></label>
        <label class="tw-block"><input type="checkbox" name="usernameNumber" [(ngModel)]="preferences.username.includeNumber" /> 包含数字</label>
      }
      @case ('uuid') {
        <label class="tw-block"><input type="checkbox" name="uuidHyphens" [(ngModel)]="preferences.uuid.hyphens" /> 保留短横线</label>
        <label class="tw-block"><input type="checkbox" name="uuidUppercase" [(ngModel)]="preferences.uuid.uppercase" /> 大写</label>
        <label class="tw-block"><input type="checkbox" name="uuidBraces" [(ngModel)]="preferences.uuid.braces" /> 花括号</label>
      }
    }
    <button bitButton buttonType="primary" type="submit" [disabled]="busy()">生成</button>
    </fieldset>
  </form>
  @if (notice()) { <p role="status">{{ notice() }}</p> }
  @if (value()) {
    <bit-form-field><bit-label>临时生成结果</bit-label><input bitInput #generatedResult readonly [value]="value()" autocomplete="off" [spellcheck]="false" /></bit-form-field>
    <button bitButton buttonType="secondary" type="button" (click)="generatedResult.select()">选中后手动复制</button>
    <button bitButton buttonType="secondary" type="button" (click)="clear()">清除</button>
  }
</section>
