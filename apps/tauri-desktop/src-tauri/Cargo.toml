[package]
name = "vaultmesh-tauri-desktop"
default-run = "vaultmesh-tauri-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "vaultmesh_tauri_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aes-gcm = "0.10.3"
atomic-write-file.workspace = true
base64.workspace = true
chrono.workspace = true
csv = "1.4.0"
hmac.workspace = true
if-addrs = "0.15.0"
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
mailparse = "0.16.1"
mdns-sd = { version = "0.21.3", default-features = false }
rcgen = "0.14.8"
open = "5.4.0"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
rand_core.workspace = true
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "form", "json", "query", "rustls"] }
rustls = { version = "0.23.35", default-features = false, features = ["aws_lc_rs", "std"] }
scrypt = "0.11.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2 = "0.6.5"
spake2-conflux.workspace = true
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }
ssh-key = { version = "0.6.7", features = ["ed25519", "encryption", "getrandom", "p256", "p384", "p521", "rsa"] }
tauri = { version = "2.11.5", features = ["image-png", "tray-icon"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = { version = "2.10.1", default-features = false, features = ["native-tls", "zip"] }
uuid.workspace = true
url = "2.5.8"
vaultmesh-ffi = { path = "../../../crates/vault-ffi" }
zeroize.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-autostart = "2.5.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.174"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10.1"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSError", "NSString"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["LAContext", "LABiometryType", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }

[dev-dependencies]
vaultmesh-core = { path = "../../../crates/vault-core" }
