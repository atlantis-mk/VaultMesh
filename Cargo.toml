[workspace]
members = [
  "crates/agent-mcp",
  "crates/vault-android-runtime",
  "crates/vault-core",
  "crates/vault-ffi",
  "apps/tauri-desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.0.10-review"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/atlantis-mk/VaultMesh"
homepage = "https://github.com/atlantis-mk/VaultMesh"

[workspace.dependencies]
argon2 = "0.5.3"
atomic-write-file = "0.3.0"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
hmac = "0.12.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha1 = "0.10.6"
sha2 = "0.10.9"
spake2-conflux = { version = "0.6.0", features = ["constant-time"] }
thiserror = "2.0.12"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
zeroize = "1.8.1"

# Native Debug previews still exercise the production KDF parameters. Optimize
# only the password-derivation implementation so local UI testing is not
# dominated by unoptimized crypto loops.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# PIN quick unlock uses scrypt. Keep its production parameters unchanged, but
# compile the password-derivation hot path with optimization in local Debug
# builds so browser unlock latency reflects the shipped application.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3
